name: Release artifact smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID containing a distill-release artifact
        required: true
        type: string

permissions:
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifact (no checkout)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          dist_dir="$RUNNER_TEMP/distill-release"
          mkdir -p "$dist_dir"
          gh run download "$RUN_ID" \
            --name "distill-release-$RUN_ID" \
            --dir "$dist_dir"
          test -s "$dist_dir/SHA256SUMS"
          shopt -s nullglob
          archives=("$dist_dir"/distill-*.tar.gz)
          test "${#archives[@]}" -eq 2
