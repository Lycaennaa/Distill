name: CI

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'clippy.toml'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'clippy.toml'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit and process suites
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release
      - name: Validate packaged source
        run: cargo package --locked --no-verify
      - name: Install packaged CLI
        run: cargo install --path . --locked --root target/ci-install --force
      - name: Smoke real macOS toolchains
        shell: bash
        run: |
          set -euo pipefail
          distill="$GITHUB_WORKSPACE/target/ci-install/bin/distill"
          "$distill" --version
          xcodebuild -version
          swift --version
          "$distill" --cwd "$GITHUB_WORKSPACE/tests/fixtures/real-swift-package" swift build -- --configuration release --build-path "$GITHUB_WORKSPACE/target/ci-swift-build"
          "$distill" --cwd "$GITHUB_WORKSPACE" cargo build -- --locked
          "$distill" --cwd "$GITHUB_WORKSPACE" cargo clippy -- --all-targets

  windows:
    name: Windows runtime tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - name: Run Windows library tests
        run: cargo test --locked --lib
      - name: Run Windows process tests
        run: cargo test --locked --test process_windows
      - name: Run Windows Clippy
        run: cargo clippy --locked --lib -- -D warnings
      - name: Build and smoke the Windows binary
        run: |
          cargo build --locked --release
          .\target\release\distill.exe --version

  windows-gnu:
    name: Cross-build Windows GNU target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install GNU cross linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64
      - name: Install Windows GNU Rust target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Build Windows GNU release binary
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: Upload Windows GNU executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distill-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/distill.exe
          if-no-files-found: error