[package]
name = "distill"
version = "2.2.0"
edition = "2024"
description = "Compact local digests for development tool output"
license-file = "LICENSE" # Apache-2.0 with Commons Clause
repository = "https://github.com/lycaennaa/distill"
rust-version = "1.94"
readme = "README.md"
keywords = ["cli", "xcode", "swift", "cargo"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
plist = "1.8"
signal-hook = "0.3"
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "poll", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[profile.dev]
incremental = true

[profile.release]
strip = true
incremental = true

[[bin]]
name = "distill"
path = "src/main.rs"

[lib]
name = "distill"
path = "src/lib.rs"

[lints.clippy]
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
